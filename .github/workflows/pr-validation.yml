name: Pull Request Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore PeekDesktop.sln

    - name: Build
      run: dotnet build PeekDesktop.sln -c Release --no-restore --nologo

    - name: Run interop safety harness
      run: dotnet run --project src/PeekDesktop.InteropHarness/PeekDesktop.InteropHarness.csproj -c Release --no-build -- 10000

    - name: Publish x64 NativeAOT
      run: dotnet publish src/PeekDesktop/PeekDesktop.csproj -c Release -r win-x64 --self-contained true --nologo

    - name: Verify published localization
      shell: pwsh
      run: |
        $programSource = Get-Content "src/PeekDesktop/Program.cs" -Raw
        if ($programSource.Contains("--selftest-localization")) {
          & "src/PeekDesktop/bin/Release/net10.0-windows/win-x64/publish/PeekDesktop.exe" --selftest-localization
          if ($LASTEXITCODE -ne 0) {
            throw "Published localization self-test failed with exit code $LASTEXITCODE."
          }
        } else {
          Write-Host "Published localization self-test is not present on this branch."
        }

    - name: Publish ARM64 NativeAOT
      run: dotnet publish src/PeekDesktop/PeekDesktop.csproj -c Release -r win-arm64 --self-contained true --nologo
